<h2 dir="ltr" style="text-align:start">Thanawya Plus</h2>
<p>اضغط الزرار عشان تنزّل التطبيق. أندرويد هيسألك تسمح بالتثبيت من المتصفح، وده طبيعي لأن التطبيق مش على المتجر.</p>
<p><button id="d" style="min-height:48px;padding:0 22px;border:0;border-radius:4px;background:#251f21;color:#fff;font:inherit;font-size:16px">نزّل التطبيق (APK)</button></p>
<p style="font-size:13px;color:#585254">النسخة ١.٦: فيها الشات الصوتي. أول مرة هيطلب إذن المايك.</p>
