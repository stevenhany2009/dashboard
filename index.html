<style>
:root{--page:#f7f5f1;--card:#fff;--ink:#1b2430;--ink2:#6a707a;--teal:#9a7b45;--teal2:#b8975a;--deep:#14233a;--hair:#e8e4dc;--red:#a8324a;--sand:#f1ece1;--head:#14233a;--sh:0 1px 2px rgba(20,35,58,.05),0 8px 22px rgba(20,35,58,.05)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--page);color:var(--ink);font-family:"Noto Sans Arabic","Noto Naskh Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;font-size:15px;line-height:1.7}
#app{display:flex;flex-direction:column;height:100dvh;max-width:720px;margin:0 auto;background:var(--page)}

.label{font-size:12px;font-weight:600;color:var(--teal);margin:26px 0 2px;letter-spacing:.02em}
.fact{display:inline-block;background:var(--sand);color:var(--head);font-weight:600;margin:0 0 10px;padding:3px 12px;border-radius:999px;font-size:13px}
p{margin:0 0 12px}
.sub{color:var(--ink2);font-size:13px}

<style>
  #th-loader {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: radial-gradient(circle at top, #172554, #090d16 70%);
    color: #f8fafc;
    font-family: system-ui, -apple-system, sans-serif;
    transition: opacity 0.45s ease, visibility 0.45s ease;
  }

  #th-loader.hide {
    opacity: 0;
    visibility: hidden;
  }

  .th-ring {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: conic-gradient(from 0deg, #38bdf8, #818cf8, #34d399, transparent 78%);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 6px), #000 calc(100% - 5px));
    mask: radial-gradient(farthest-side, transparent calc(100% - 6px), #000 calc(100% - 5px));
    animation: th-spin 0.95s linear infinite;
    box-shadow: 0 0 28px rgba(56, 189, 248, 0.25);
  }

  .th-title {
    font-size: 14px;
    letter-spacing: 3px;
    font-weight: 700;
    color: #e2e8f0;
  }

  .th-dots::after {
    content: "";
    animation: th-dots 1.2s steps(4, end) infinite;
  }

  @keyframes th-spin {
    to { transform: rotate(360deg); }
  }

  @keyframes th-dots {
    0% { content: ""; }
    25% { content: "."; }
    50% { content: ".."; }
    75% { content: "..."; }
  }
</style>

<div id="th-loader" aria-label="جاري التحميل">
  <div class="th-ring"></div>
  <div class="th-title">LOADING<span class="th-dots"></span></div>
</div>

<script>
  window.addEventListener("load", () => {
    const loader = document.getElementById("th-loader");
    if (!loader) return;
    setTimeout(() => loader.classList.add("hide"), 350);
  });
  setTimeout(() => { var l = document.getElementById("th-loader"); if (l) l.classList.add("hide"); }, 5000);
</script>
