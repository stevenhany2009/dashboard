name: Update reels pool
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build pool
        run: python3 tools/build_pool.py
      - name: Commit
        run: |
          git config user.name "reels-bot"
          git config user.email "reels-bot@users.noreply.github.com"
          git add reels-pool.json tools/channels.json
          git diff --cached --quiet || (git commit -m "Update reels pool" && git push)
